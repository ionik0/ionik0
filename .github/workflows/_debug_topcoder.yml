name: debug topcoder api
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: v5 members
        run: |
          for h in ionik0 Ionik0 IONIK0 ionik_0 Ionik; do
            echo "=== v5/members/$h ==="
            curl -sS -w "\nHTTP:%{http_code}\n" "https://api.topcoder.com/v5/members/$h"
          done
          echo "=== profile page HTML grep ==="
          curl -sSL "https://profiles.topcoder.com/ionik0" | grep -io 'handle[^,}]*' | head -20 || true
          echo "=== v5/members?handleLower=ionik0 ==="
          curl -sS -w "\nHTTP:%{http_code}\n" "https://api.topcoder.com/v5/members?handleLower=ionik0"
