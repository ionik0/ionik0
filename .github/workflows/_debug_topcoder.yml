name: debug topcoder api
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: v5 members
        run: |
          echo "=== v5/members/ionik0 ==="
          curl -sS "https://api.topcoder.com/v5/members/ionik0" | python3 -m json.tool || true
          echo "=== v5/members?handle=ionik0 ==="
          curl -sS "https://api.topcoder.com/v5/members?handle=ionik0" | python3 -m json.tool || true
          echo "=== v3/members/ionik0/stats ==="
          curl -sS "https://api.topcoder.com/v3/members/ionik0/stats" | python3 -m json.tool || true
