name: debug codechef page structure
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch and inspect codechef profile
        run: |
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -m 30 "https://www.codechef.com/users/ionik_0" -o profile.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          echo "=== rating-header block (contains rating-number + rating-ranks + rating-star) ==="
          grep -o "rating-header text-center.\{1200\}" profile.html | head -1
          echo
          echo "=== problems-solved block ==="
          grep -o "rating-data-section problems-solved.\{1500\}" profile.html | head -1
          echo
          echo "=== country flag / name near rating ==="
          grep -o '.\{60\}Country.\{150\}' profile.html | head -5
