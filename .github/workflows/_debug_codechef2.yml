name: debug codechef page structure
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch and inspect codechef profile
        run: |
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -m 30 "https://www.codechef.com/users/ionik_0" -o profile.html -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          echo "=== rating-number ==="
          grep -o 'rating-number[^<]*<[^>]*>[^<]*' profile.html | head -5
          echo "=== rating-star / rating-ranks context ==="
          grep -o '.\{80\}rating-star.\{80\}' profile.html | head -5
          grep -o '.\{80\}rating-ranks.\{200\}' profile.html | head -5
          echo "=== all_rating / rating chart json ==="
          grep -o 'var all_rating = \[.\{0,300\}' profile.html | head -3
          echo "=== header-page-title / name ==="
          grep -o '<title>[^<]*</title>' profile.html
          echo "=== FILE SIZE ==="
          wc -c profile.html
